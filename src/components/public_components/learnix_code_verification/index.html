<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>LearnIx Verification code</title>
    <link rel="icon" href="https://res.cloudinary.com/dnc3hhrye/image/upload/v1764894934/LearnIx_ilujzx.png">
    <script>
            document.addEventListener("DOMContentLoaded", () => {
            const verificationCode = document.getElementById("verificationCode");
            const codeCopiedMessage = document.getElementById("codeCopiedMessage");

            function copyCode() {
                const code = verificationCode.textContent.trim();

                navigator.clipboard.writeText(code)
                    .then(() => {
                        console.log("Code copied!");
                    })
                    .catch(() => {
                        console.log("Copy failed");
                    });

                codeCopiedMessage.classList.remove("notActive");
                setTimeout(() => {
                    codeCopiedMessage.classList.add("notActive");
                }, 3000);
            }

            window.copyCode = copyCode;
        });

    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container .card {
            padding: 40px;
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            background: white;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: slideIn 0.5s ease;
        }


        .container .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
        }

        .container .card .upper {
            text-align: center;
            margin-bottom: 30px;
        }

        .container .card .upper .img {
            margin-bottom: 20px;
        }

        .container .card .upper .img img {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            transition: transform 0.3s ease;
        }

        .container .card .upper .img img:hover {
            transform: scale(1.05);
        }

        .container .card .down .up h2 {
            font-size: 28px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
        }

        .container .card .down .p {
            font-size: 15px;
            line-height: 1.6;
            color: #4a5568;
            margin-bottom: 25px;
        }

        .container .card .down .p i {
            font-weight: 600;
            color: #667eea;
            font-style: normal;
        }

        .container .card .down .code {
            display: flex;
            gap: 12px;
            margin: 30px 0;
        }

        .container .card .down .code p {
            flex: 1;
            padding: 18px;
            border-radius: 12px;
            font-size: 24px;
            font-weight: 700;
            border: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            color: #667eea;
            letter-spacing: 4px;
            transition: all 0.3s ease;
        }

        .container .card .down .code p:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .container .card .down .code i {
            padding: 14px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 52px;
            height: 52px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .container .card .down .code i:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .container .card .down .code i:active {
            transform: translateY(0);
        }

        .container .card .down .success.notActive {
            display: none;
        }

        .container .card .down .success {
            margin-bottom: 20px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            color: #155724;
            display: flex;
            gap: 10px;
            align-items: center;
            border-radius: 12px;
            border: 1px solid #c3e6cb;
            animation: fadeIn linear 3s;
            font-size: 14px;
            font-weight: 500;
        }

        .container .card .down .success i {
            font-size: 16px;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(-10px);
            }
            50% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-10px);
            }
        }

        .container .card .down .caution {
            color: #856404;
            border: 1px solid #ffeaa7;
            padding: 12px 16px;
            background: linear-gradient(135deg, #fff3cd 0%, #ffe8a1 100%);
            border-radius: 12px;
            width: 100%;
            margin-bottom: 20px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            gap: 10px;
            align-items: center;
            transition: all 0.3s ease;
        }

        .container .card .down .caution:hover {
            box-shadow: 0 2px 8px rgba(133, 100, 4, 0.15);
        }

        .container .card .down .caution i {
            font-size: 14px;
            flex-shrink: 0;
        }

        .container .card .down .didnot {
            font-size: 13px;
            color: #718096;
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            font-style: italic;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="upper">
                <div class="img">
                    <img src="https://res.cloudinary.com/dnc3hhrye/image/upload/v1764894934/LearnIx_ilujzx.png" alt="LearnIx Logo">
                </div>
                <div class="up">
                    <h2>Email Verification</h2>
                </div>
            </div>
            <div class="down">
                <div class="p">
                    <p>Hello <i>franconellyiradukunda@gmail.com</i>! Thanks for choosing LearnIx. Your verification code is:</p>
                </div>
                <div class="code">
                    <p class="c" id="verificationCode">2008</p>
                    <i class="fa-regular fa-copy" id="copyButton" onclick="copyCode()" title="Click to copy code"></i>
                </div>
                <div class="success notActive" id="codeCopiedMessage">
                    <i class="fa-solid fa-check"></i>
                    <p>Code copied to clipboard</p>
                </div>
                <div class="caution">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>Never share this code with anyone. LearnIx support will never ask for it.</span>
                </div>
                <div class="didnot">
                    If you didn't request this code, you can safely ignore this email.
                </div>
            </div>
        </div>
    </div>
</body>
</html>
